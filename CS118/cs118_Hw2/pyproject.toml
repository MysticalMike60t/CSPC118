[project]
name = "homework2-cadenfinkelstein"
version = "0.1.0"
description = "Homework #2 for CPSC 118."
requires-python = ">=3.14"
dependencies = ["cs118_Hw2_lib"]

[tool.uv.sources]
cs118_Hw2_lib = { workspace = true }

[tool.uv.workspace]
members = ["lib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
